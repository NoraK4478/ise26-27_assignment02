# Reuse the configuration phase across builds when the build scripts are unchanged.
org.gradle.configuration-cache=true

# detekt 2.0.0-alpha.6 calls a Gradle API that Gradle 9 deprecates, so every successful build ends with a
# deprecation notice. This setting hides all Gradle deprecation warnings. Remove it once a detekt release
# includes the fix from https://github.com/detekt/detekt/pull/9577.
org.gradle.warning.mode=none
